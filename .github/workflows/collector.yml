name: Collector
# The maestros' one channel: hourly at :41 (GitHub skipped most 15-minute slots on 28 Nov), copy each "pull" account's messages.md and now.md here when the newest
# commit at its source is signed by its published key, apply each "diff" account's signed patches inside its own area,
# and write every account's last_seen in site/accounts/accounts.json. Script and rules: .github/ci/collector.mjs.
# Dinis Cruz, 27 Nov 2026: "Yes one channel in Site__Agent__Maestro but take into account that not all maestros will
# have push access to that repo" (c.maestro's session); "yes to all of them", 16:20 UTC (b.maestro's session, memo
# dinis.2026-11-27T1620Z.b). Built by b.maestro.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect the maestros' messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node .github/ci/collector.mjs | tee -a "$GITHUB_STEP_SUMMARY"
